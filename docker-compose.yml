services:
  # Base de Datos MongoDB
  mongo:
    image: mongo:7.0
    container_name: omnitron-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminsecretpassword}
    volumes:
      - mongo_data:/data/db
    networks:
      - omnitron-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u ${MONGO_ROOT_USER:-admin} -p ${MONGO_ROOT_PASSWORD:-adminsecretpassword} --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Panel visual de MongoDB (Mongo Express) - Opcional para inspección
  mongo-express:
    image: mongo-express:latest
    container_name: omnitron-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminsecretpassword}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - omnitron-network

  # Microservicio de Autenticación
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: omnitron-auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_SERVICE_PORT:-4001}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminsecretpassword}@mongo:27017/${AUTH_DB_NAME:-omnitron_auth}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super_secret_omnitron_jwt_key_2026}
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - omnitron-network

  # Microservicio de Catálogo de Cursos y Categorías
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: omnitron-catalog-service
    restart: unless-stopped
    environment:
      PORT: ${CATALOG_SERVICE_PORT:-4002}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminsecretpassword}@mongo:27017/${CATALOG_DB_NAME:-omnitron_catalog}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super_secret_omnitron_jwt_key_2026}
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - omnitron-network

  # Microservicio de Órdenes, Carrito y Pagos
  order-payment-service:
    build:
      context: ./services/order-payment-service
      dockerfile: Dockerfile
    container_name: omnitron-order-payment-service
    restart: unless-stopped
    environment:
      PORT: ${ORDER_SERVICE_PORT:-4003}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminsecretpassword}@mongo:27017/${ORDER_DB_NAME:-omnitron_orders}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super_secret_omnitron_jwt_key_2026}
      CATALOG_SERVICE_URL: http://catalog-service:4002/api/courses
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      IZIPAY_PUBLIC_KEY: ${IZIPAY_PUBLIC_KEY}
      IZIPAY_HMAC_SHA256: ${IZIPAY_HMAC_SHA256}
      IZIPAY_SERVER_URL: ${IZIPAY_SERVER_URL:-https://api.micuentaweb.pe}
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - omnitron-network

  # Frontend (React + Vite + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnitron-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - omnitron-network

  # API Gateway (Nginx Reverse Proxy)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: omnitron-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - auth-service
      - catalog-service
      - order-payment-service
      - frontend
    networks:
      - omnitron-network

networks:
  omnitron-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
