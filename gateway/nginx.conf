server {
    listen 80;
    server_name localhost;

    # Evita que las redirecciones alteren el puerto público del host
    port_in_redirect off;

    # DNS interno de Docker con resolución dinámica
    resolver 127.0.0.11 valid=5s;

    # Configuración de compresión gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;

    # Healthcheck para el API Gateway
    location /health {
        return 200 '{"status":"UP","gateway":"omnitron-nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # Microservicio de Autenticación
    location /api/auth {
        set $auth_upstream http://auth-service:4001;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Microservicio de Catálogo de Cursos y Categorías
    location ~ ^/api/(courses|categories) {
        set $catalog_upstream http://catalog-service:4002;
        proxy_pass $catalog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Microservicio de Órdenes, Carrito y Pagos
    location ~ ^/api/(cart|orders|payments) {
        set $order_upstream http://order-payment-service:4003;
        proxy_pass $order_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend (React / Vite SPA)
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
